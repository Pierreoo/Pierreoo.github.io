{% include base_path %}
{% assign favicon_v = "6" %}
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v={{ favicon_v }}">
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v={{ favicon_v }}">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v={{ favicon_v }}" sizes="32x32">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png?v={{ favicon_v }}" sizes="192x192">
