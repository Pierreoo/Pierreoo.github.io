{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main">
        <button type="button" class="hidden" aria-label="More sections"><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a href="{{ base_path }}/"><span>Home</span></a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item{% if link.persist %} persist{% endif %} {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}"><span>{{ link.title }}</span></a>
            </li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <div class="masthead__actions">
        <button type="button" id="theme-toggle" class="masthead__toggle" aria-label="Toggle dark mode" title="Toggle dark mode">{% include icons/sun.svg %}{% include icons/moon.svg %}</button>
      </div>
    </div>
  </div>
</div>
